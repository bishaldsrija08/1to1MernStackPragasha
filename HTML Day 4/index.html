<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form in HTML</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form action="abc.php">
      <label for="name">Name: </label>
      <input type="text" name="" id="name" required />
      <br />
      <br />
      <label for="num">Number: </label>
      <input type="number" id="num" />
      <br /><br />
      <label for="email">Email: </label>
      <input type="email" id="email" />
      <br /><br />
      <label for="pw">Password: </label>
      <input type="password" id="pw" />
      <br /><br />
      <label for="date">Date: </label>
      <input type="date" id="date" />
      <br /><br />
      <label for="dt">DateTime: </label>
      <input type="datetime" id="dt" />
      <br /><br />
      <label for="color">Color: </label>
      <input type="color" id="color" />
      <br /><br />
      <label for="file">File: </label>
      <input type="file" id="file" />
      <br /><br />
      <label for="range">Range: </label>
      <input type="range" id="range" />
      <br /><br />
      <label for="url">URL: </label>
      <input type="url" id="url" />
      <br /><br />
      <label for="search">Search: </label>
      <input type="search" id="search" />
      <br /><br />
      <label for="male">Male</label>
      <input type="radio" value="male" name="gender" id="male" />
      <label for="female">Female</label>
      <input type="radio" value="female" name="gender" id="female" />
      <label for="other">Other</label>
      <input type="radio" value="other" name="gender" id="other" />
      <br /><br />
      <label for="country">Country: </label>
      <select name="country" id="country">
        <option value="usa">USA</option>
        <option value="canada" selected>Canada</option>
        <option value="uk">UK</option>
        <option value="Nepal">Nepal</option>
      </select>
      <br /><br />
      <h5>Which vehicles do you have?</h5>
      <label for="bike">Bike</label>
      <input type="checkbox" id="bike" name="vehicle" value="Bike" />
      <label for="bus">Bus</label>
      <input type="checkbox" id="bus" name="vehicle" value="Bus" />
      <label for="car">Car</label>
      <input type="checkbox" id="car" name="vehicle" value="Car" />
      <br /><br />
      <textarea name="" id="" rows="12" cols="30">
Write your thoughts....</textarea
      >
      <br /><br />
      <input type="reset" />
      <input type="submit" />
    </form>
  </body>
</html>
